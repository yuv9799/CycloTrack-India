<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CycloTrack India — Missing Person Report</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/emergency.css"><link rel="stylesheet" href="assets/response-center.css"></head><body><header class="rc-header"><a class="rc-logo" href="index.html">Cyclo<span>Track</span> India</a><nav><a href="index.html">Home</a><a href="response-center.html">Response Center</a><a href="helplines.html">Helplines</a></nav><a class="rc-sos" href="report.html">🆘 GET HELP</a></header><main><section class="rc-hero compact"><div><div class="rc-kicker">FAMILY SAFETY · PRIVATE REPORTING</div><h1>REPORT A <em>MISSING PERSON</em></h1><p>Submit details for authorised disaster responders. Do not publish private phone numbers or sensitive information on public channels.</p></div></section><section class="rc-section"><form class="panel missing-form" id="missingForm"><div class="two"><label>Full name<input name="name" required maxlength="120"></label><label>Age<input name="age" type="number" min="0" max="120" required></label></div><div class="two"><label>Gender<input name="gender" maxlength="40"></label><label>Last seen date/time<input name="last_seen" type="datetime-local" required></label></div><label>Last seen location<input name="location" required maxlength="300" placeholder="Village / city / landmark"></label><label>Clothing / identifying details<textarea name="details" required maxlength="1500"></textarea></label><div class="two"><label>Emergency contact name<input name="contact_name" required></label><label>Emergency contact phone<input name="contact_phone" required inputmode="tel"></label></div><label>Photo (optional)<input name="photo" type="file" accept="image/*"></label><label class="check"><input type="checkbox" required> I confirm this report is accurate and consent to sharing it with authorised responders.</label><button class="btn primary" type="submit">SUBMIT MISSING PERSON REPORT</button><div id="missingMsg" class="privacy-callout"></div></form></section></main><script>window.CYCLOTRACK_API_BASE=window.CYCLOTRACK_API_BASE||"http://localhost:8000";</script><script src="assets/missing-person.js" defer></script></body></html>
